plugins { id 'com.android.application' }
android {
    namespace 'io.github.huliexcode.jardgold'
    compileSdk 34
    defaultConfig {
        applicationId 'io.github.huliexcode.jardgold'
        minSdk 24
        targetSdk 34
        versionCode (project.findProperty('vc') ?: 2).toInteger()
        versionName (project.findProperty('vn') ?: '3.2.2')
    }
    signingConfigs {
        release {
            storeFile file('../jard.keystore')
            storePassword 'jardgold'
            keyAlias 'jard'
            keyPassword 'jardgold'
        }
    }
    buildTypes { release { signingConfig signingConfigs.release; minifyEnabled false } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies { implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.5.0' }
