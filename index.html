<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta name="app-version" content="2.10.0">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>جرد الذهب — المخزون والحسابات</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsbarcode/3.11.6/JsBarcode.all.min.js"></script>
<style>
:root{
  color-scheme:light;
  --bg:#F2F4F3; --surface:#FFFFFF; --ink:#15211D; --muted:#5A6762; --line:#D9DEDB; --soft:#E9EDEB;
  --accent:#C9A227; --accent-ink:#15211D; --accent-text:#7A5C00; --ok:#1F7A5A; --bad:#B3202B;
  --okbg:#DDF1E8; --badbg:#FADADD; --goldbg:#F6EBC4; --focus:#1B6FD1;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0E1613; --surface:#15211D; --ink:#ECEFEA; --muted:#9AA8A2; --line:#2A3A34; --soft:#1C2B26;
    --accent:#D9B53F; --accent-ink:#15211D; --accent-text:#E3C25A; --ok:#4CC38F; --bad:#FF7B85;
    --okbg:#173A2D; --badbg:#43202A; --goldbg:#3A3213; --focus:#6DB0FF;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0E1613; --surface:#15211D; --ink:#ECEFEA; --muted:#9AA8A2; --line:#2A3A34; --soft:#1C2B26;
  --accent:#D9B53F; --accent-ink:#15211D; --accent-text:#E3C25A; --ok:#4CC38F; --bad:#FF7B85;
  --okbg:#173A2D; --badbg:#43202A; --goldbg:#3A3213; --focus:#6DB0FF;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans Arabic','Segoe UI',Tahoma,system-ui,sans-serif;font-size:15px;line-height:1.6;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
h1,h2,h3,p{margin:0}
h1{font-size:23px;font-weight:700}
h2{font-size:18px;font-weight:700}
h3{font-size:15px;font-weight:600}
small,.muted{color:var(--muted)}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace;direction:ltr;unicode-bidi:plaintext;font-size:13px}

.app{display:grid;grid-template-columns:220px 1fr;min-height:100vh}
.side{background:var(--ink);color:var(--bg);padding:20px 14px;display:flex;flex-direction:column;gap:20px;position:sticky;top:0;align-self:start;height:100vh}
.brand{display:flex;align-items:center;gap:10px;padding:0 6px}
.brand b{font-size:22px;font-weight:700;color:var(--accent)}
.bars{width:34px;height:26px;flex:none}
.nav{display:flex;flex-direction:column;gap:3px}
.nav button{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:10px;cursor:pointer;opacity:.85}
.nav button:hover{background:rgba(127,127,127,.2);opacity:1}
.nav button[aria-current="page"]{background:var(--accent);color:var(--accent-ink);font-weight:600;opacity:1}
.nav button:focus-visible{outline:3px solid var(--accent)}
.nav svg{width:20px;height:20px;flex:none}
.main{padding:24px 28px 48px;max-width:none;width:100%;min-width:0}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.head p{margin-top:2px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row.end{justify-content:flex-end}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--ink);background:var(--ink);color:var(--bg);border-radius:10px;padding:8px 16px;cursor:pointer;font-weight:600;min-height:42px}
.btn:hover{filter:brightness(1.12)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{background:var(--soft);filter:none}
.btn.accent{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{background:transparent;border-color:var(--line);color:var(--bad)}
.btn.sm{min-height:32px;padding:4px 10px;font-size:13px;border-radius:8px}
.btn.lg{min-height:50px;font-size:16px;padding:10px 24px}
.btn svg{width:18px;height:18px}
input,select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 12px;width:100%;min-height:42px}
textarea{resize:vertical}
input[type="checkbox"]{width:auto;min-height:0}
label.f{display:flex;flex-direction:column;gap:5px;font-weight:600;font-size:14px}
label.f small{font-weight:400}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.span2{grid-column:span 2}.span3{grid-column:span 3}
.inl{display:flex;gap:6px}
.inl input{flex:1}
.ig{position:relative}
.ig input{padding-inline-end:44px}
.ig span{position:absolute;inset-inline-end:12px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:12px;pointer-events:none}
fieldset{border:1px solid var(--line);border-radius:12px;padding:14px;margin:0;min-width:0}
legend{padding:0 8px;font-weight:700;color:var(--accent-text)}
details{border:1px solid var(--line);border-radius:12px;padding:10px 14px}
details>summary{cursor:pointer;font-weight:600}
details[open]>summary{margin-bottom:12px}

/* wizard */
.intake{display:grid;grid-template-columns:minmax(300px,390px) 1fr;gap:18px;align-items:start}
.wiz{position:sticky;top:18px}
.stepper{display:flex;gap:6px;list-style:none;padding:0;margin:0 0 16px}
.stepper li{flex:1;display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--muted)}
.stepper li i{display:block;height:4px;border-radius:2px;background:var(--line)}
.stepper li.done i{background:var(--accent)}
.stepper li.cur i{background:var(--ink)}
.stepper li.cur,.stepper li.done{color:var(--ink);font-weight:600}
.crumbs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px;min-height:34px;align-items:center}
.crumb{display:inline-flex;gap:8px;align-items:center;background:var(--goldbg);color:var(--accent-text);border:0;border-radius:999px;padding:4px 12px;font-weight:700;cursor:pointer;min-height:32px}
.crumb i{font-style:normal;opacity:.7}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:10px;margin-top:10px}
.tile{border:1px solid var(--line);background:var(--surface);border-radius:14px;min-height:70px;padding:8px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-weight:700;text-align:center}
.tile:hover{border-color:var(--accent);background:var(--goldbg)}
.tile small{font-weight:500}
.tile.karat b{font-size:28px;line-height:1.1}
.okbox{background:var(--okbg);color:var(--ok);border-radius:12px;padding:12px 14px;font-weight:600;margin-top:6px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-top:6px}
.seg button{border:0;background:var(--surface);padding:8px 22px;cursor:pointer;min-height:42px;font-weight:600}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.ctx{display:flex;gap:6px;flex-wrap:wrap}
.pill{display:inline-block;background:var(--soft);border-radius:999px;padding:2px 12px;font-size:13px;font-weight:600}
.pill.gold{background:var(--goldbg);color:var(--accent-text)}

.scan{display:flex;align-items:center;gap:8px;background:var(--surface);border:2px solid var(--ink);border-radius:14px;padding:6px 6px 6px 10px}
.scan:focus-within{border-color:var(--accent)}
.scan input{border:0;background:transparent;min-height:46px;font-size:18px;padding:4px 6px}
.scan input:focus-visible{outline:none}
.scan-ico{width:28px;height:28px;color:var(--accent-text);flex:none;margin-inline-start:6px}
.dim .scan,.scan.dim{opacity:.5}
.hint{color:var(--muted);font-size:13px;margin:6px 2px 4px}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px}
.panel + .panel,.panel + .tablewrap,.tablewrap + .panel{margin-top:14px}
.panel>h2,.panel>h3:first-child{margin-bottom:4px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.kpi span{display:block;color:var(--muted);font-size:13px}
.kpi b{display:block;font-size:21px;font-weight:700;margin-top:2px}
.kpi.net{border-color:var(--accent);border-width:2px}
.kpi.neg b,.neg{color:var(--bad)}
.pos{color:var(--ok);font-weight:600}.neg{font-weight:600}
.tablewrap{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow-x:auto}
table{border-collapse:collapse;width:100%}
th{font-weight:600;font-size:13px;color:var(--muted);text-align:start;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--soft)}
td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tfoot td{font-weight:700;background:var(--soft)}
td input{min-width:84px;padding:6px 8px;min-height:36px}
td .nm small{display:block}
.act{display:flex;gap:4px;justify-content:flex-end}
.chip{display:inline-block;padding:1px 10px;border-radius:999px;font-weight:600;font-size:13px;background:var(--okbg);color:var(--ok)}
.chip.sold{background:var(--soft);color:var(--muted)}
.chip.gold,.chip.used{background:var(--goldbg);color:var(--accent-text)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.chips button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 14px;cursor:pointer;min-height:34px}
.chips button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.empty{text-align:center;padding:38px 16px}
.empty p{color:var(--muted);margin:6px 0 16px}
.calc{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;background:var(--soft);border-radius:12px;padding:12px}
.calc div span{display:block;color:var(--muted);font-size:13px}
.calc div b{font-size:18px}
.total{display:flex;justify-content:space-between;align-items:baseline;border-top:2px solid var(--ink);padding-top:10px;margin-top:4px;font-size:20px;font-weight:700}
.sub{display:flex;justify-content:space-between;color:var(--muted);padding:3px 0}
.tx{border-bottom:1px solid var(--line);padding:10px 0}
.tx:last-child{border-bottom:0}
.tx summary{cursor:pointer;display:flex;gap:10px;align-items:center;justify-content:space-between;list-style:none}
.tx summary::-webkit-details-marker{display:none}
.tx .lines{margin:8px 0 0;padding:8px 12px;background:var(--soft);border-radius:10px;font-size:14px;overflow-x:auto}
.tx .lines table th{background:transparent}
.warn{background:var(--goldbg);color:var(--accent-text);border-radius:10px;padding:8px 12px;font-weight:600}

/* sale cards */
.icard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:12px}
.icard+.icard{margin-top:10px}
.icard header{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;background:var(--soft);border-radius:10px;padding:10px}
.facts span,.kv span{display:block;color:var(--muted);font-size:12px}
.facts b,.kv b{font-size:15px}
.vals{display:grid;grid-template-columns:minmax(200px,1.4fr) 110px repeat(3,minmax(90px,1fr));gap:12px;align-items:end}

dialog{border:1px solid var(--line);border-radius:16px;background:var(--surface);color:var(--ink);padding:0;width:min(700px,calc(100% - 20px));max-height:92vh}
dialog.wide{width:min(1120px,calc(100% - 20px))}
dialog::backdrop{background:rgba(6,14,11,.62)}
.modal{padding:20px;display:flex;flex-direction:column;gap:14px}
.pform{display:flex;flex-direction:column;gap:14px}
.err{color:var(--bad);font-weight:600;min-height:1.2em}
.trow{display:flex;gap:8px;align-items:center;margin-bottom:6px;flex-wrap:wrap}
.trow input[type="text"],.trow input:not([type]){flex:1;max-width:320px}
.video{position:relative;background:#000;border-radius:12px;overflow:hidden;aspect-ratio:4/3}
.video video{width:100%;height:100%;object-fit:cover}
.laser{position:absolute;inset-inline:8%;top:50%;height:2px;background:var(--accent);box-shadow:0 0 12px var(--accent);animation:sweep 1.8s ease-in-out infinite alternate}
@keyframes sweep{from{top:18%}to{top:82%}}
.labels{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.label{border:1px dashed var(--line);border-radius:6px;padding:6px;text-align:center;background:#fff;color:#000}
.label svg{max-width:100%;height:auto}
.label .ln{font-size:12px;font-weight:700;line-height:1.3}
.label .ls{font-size:11px}
.rpt table{font-size:13px}
.rpt .rhead{margin-bottom:10px}
.rpt .rhead small{display:block}
#toasts{position:fixed;inset-inline:0;bottom:calc(76px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;z-index:50}
.toast{background:var(--ink);color:var(--bg);padding:9px 18px;border-radius:10px;font-weight:500;max-width:90%}
.toast.bad{background:var(--bad);color:#fff}

@media (max-width:1000px){.intake{grid-template-columns:1fr}.wiz{position:static}.vals{grid-template-columns:1fr 1fr}}
@media (max-width:899px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;inset-inline:0;bottom:0;top:auto;height:auto;flex-direction:row;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:20}
  .brand{display:none}
  .nav{flex-direction:row;width:100%;justify-content:space-between}
  .nav button{flex-direction:column;gap:2px;padding:6px 2px;font-size:11px;flex:1;align-items:center;justify-content:center;text-align:center}
  .main{padding:16px 12px 110px}
}
@media (max-width:720px){
  .grid,.grid3{grid-template-columns:1fr 1fr}
  .span3{grid-column:span 2}
  .calc{grid-template-columns:1fr 1fr}
  .rt thead{display:none}
  .rt,.rt tbody,.rt tfoot,.rt tr,.rt td{display:block;width:100%}
  .rt tr{padding:10px 12px;border-bottom:1px solid var(--line);display:grid;grid-template-columns:1fr 1fr;gap:6px 10px}
  .rt td{border:0;padding:0}
  .rt td::before{content:attr(data-l);display:block;color:var(--muted);font-size:12px}
  .rt td.full{grid-column:span 2}
  .rt td.nol::before{display:none}
}
@media (max-width:460px){.grid,.grid3,.vals{grid-template-columns:1fr}.span2,.span3{grid-column:auto}}
@media (prefers-reduced-motion:reduce){.laser{animation:none}}
@media print{
  @page{size:A4 landscape;margin:10mm}
  body{background:#fff;color:#000;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  body>*:not(dialog){display:none!important}
  dialog{position:static!important;border:0;width:auto!important;max-height:none;overflow:visible;background:#fff;color:#000}
  .noprint{display:none!important}
  .modal{padding:0}
  .tablewrap{border:0;overflow:visible}
  .rpt table{font-size:10.5px}
  .rpt th,.rpt td{padding:4px 6px;border-bottom:1px solid #999;color:#000}
  .rpt th{background:#eee}
  .labels{grid-template-columns:repeat(3,1fr)}
  .label{border:1px dashed #999}
}
.tree{display:flex;flex-direction:column;gap:12px;margin-top:12px}
.tgrp{border:1px solid var(--line);border-radius:12px;padding:8px 12px;background:var(--surface)}
.tnode{display:flex;gap:8px;align-items:center;margin:6px 0}
.tnode input{flex:1;min-width:0}
.tgrp>.tnode>input{font-weight:700}
.tkids{margin-inline-start:12px;padding-inline-start:14px;border-inline-start:2px solid var(--line)}
.bfd{display:flex;flex-wrap:wrap;gap:6px;font-size:13px}
.bfd span{border-radius:8px;padding:6px 10px;background:var(--soft)}
.bfd .s1{background:var(--goldbg);color:var(--accent-text)}
.mini th,.mini td{padding:7px 10px;text-align:center}
.mini td:first-child,.mini th:first-child{text-align:start}
#printRoot{display:none}
.plabel{box-sizing:border-box;display:flex;flex-direction:column;justify-content:center;overflow:hidden;background:#fff;color:#000;line-height:1.2;font-family:'IBM Plex Sans Arabic','Segoe UI',Tahoma,sans-serif;flex:none}
.plabel .lt{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.plabel svg{display:block;width:100%}
.lpv{display:flex;justify-content:center;padding:16px;background:var(--soft);border-radius:12px;overflow:auto}
.lpv .plabel{border:1px dashed #888;box-shadow:0 1px 6px rgba(0,0,0,.18)}
@media print{
  body.lblprint>*:not(#printRoot){display:none!important}
  body.lblprint>#printRoot{display:block!important}
  body.lblprint{background:#fff}
  #printRoot .plab-roll .plabel{break-after:page;page-break-after:always}
  #printRoot .plab-roll .plabel:last-child{break-after:auto;page-break-after:auto}
  #printRoot .plab-sheet{display:grid;gap:var(--gap,2mm)}
  #printRoot .plabel{border:0!important;box-shadow:none!important}
}
.plabel.tag{padding:0}
.tp{box-sizing:border-box;display:flex;min-width:0;overflow:hidden;flex:none}
.tp.row{flex-direction:row;align-items:center;gap:1mm}
.tp.col{flex-direction:column;justify-content:center}
.tp .tc{display:flex;flex-direction:column;justify-content:center;min-width:0;flex:1}
.ttail{flex:none}
.lpv .ttail{background:repeating-linear-gradient(45deg,#f1f1f1,#f1f1f1 2px,#fff 2px,#fff 5px);border-left:1px dashed #bbb}
.lpv .tp+.tp{border-left:1px dashed #ccc}
.qrbox svg{width:100%;height:100%}

.led{display:grid;grid-template-columns:minmax(270px,350px) 1fr;gap:16px;align-items:start;margin:14px 0}
@media (max-width:900px){.led{grid-template-columns:1fr}}
.lside{display:flex;flex-direction:column;gap:12px}
.lblock{border:1px solid var(--line);border-radius:12px;padding:12px}
.lblock h3{margin-bottom:8px;font-size:14px}
.flist{display:flex;flex-wrap:wrap;gap:6px}
.flist button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 12px;cursor:pointer;min-height:32px;font-size:13px}
.flist button:hover{border-color:var(--accent);background:var(--goldbg)}
.elrow{display:flex;align-items:center;gap:4px;padding:3px 6px;border-radius:8px;cursor:pointer;font-size:13px}
.elrow.sel{background:var(--goldbg)}
.elrow>span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.elrow button{border:0;background:transparent;cursor:pointer;padding:2px 7px;border-radius:6px;color:inherit}
.elrow button:hover{background:var(--soft)}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pgrid label{display:flex;flex-direction:column;gap:2px;font-size:12px;color:var(--muted)}
.pgrid label.span{grid-column:span 2}
.pgrid label.chk{flex-direction:row;align-items:center;gap:6px;color:var(--ink)}
.pgrid input,.pgrid select{min-height:34px;padding:4px 8px}
.pgrid input[type="checkbox"]{min-height:0}
.tools{display:flex;flex-wrap:wrap;gap:6px}
.tools .btn,.ltoolbar .btn{min-height:32px;padding:2px 10px;font-size:13px}
.lstage{min-width:0}
.ltoolbar{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.ltoolbar select{width:auto;min-height:32px;padding:2px 8px}
#lscroll{background:var(--soft);border-radius:12px;padding:16px;overflow:auto;min-height:150px;display:flex;justify-content:center;align-items:center}
#lcanvas{position:relative;display:inline-block;outline:0;touch-action:none;-webkit-user-select:none;user-select:none}
#lcanvas:focus-visible{outline:2px solid var(--focus);outline-offset:6px}
.lwrap{position:relative;background:#fff;box-shadow:0 1px 6px rgba(0,0,0,.2)}
.lscale{position:absolute;left:0;top:0;transform-origin:0 0}
.lguide{position:absolute;pointer-events:none;top:0;bottom:0}
.lguide.tail{background:repeating-linear-gradient(45deg,#ececec,#ececec 1px,#fff 1px,#fff 4px);border-left:calc(1px/var(--z)) dashed #aaa;border-right:calc(1px/var(--z)) dashed #aaa}
.lguide.fold{width:0;border-left:calc(1px/var(--z)) dashed #c33}
.lov{position:absolute;left:0;top:0;right:0;bottom:0}
.ebox{position:absolute;transform-origin:50% 50%;cursor:move;outline:calc(1px/var(--z)) dashed rgba(27,111,209,.45)}
.ebox::before{content:'';position:absolute;left:calc(-4px/var(--z));right:calc(-4px/var(--z));top:calc(-4px/var(--z));bottom:calc(-4px/var(--z))}

function parseKV(code){

function parseCode(code){

  }

function findPiece(code){

const PR_DEF=()=>({mode:'browser',lang:'tspl',dpi:203,media:'gap',gap:2,density:8,speed:4,invert:false,baud:115200,bridgeUrl:'http://localhost:9101',ip:'',port:9100,queue:'',token:'',usbId:'',eplDir:''});
function normPrinter(p){
  const o=Object.assign(PR_DEF(),p&&typeof p==='object'?p:{});
  const cl=(v,a,b,d)=>{v=parseFloat(v);return isNaN(v)?d:Math.min(b,Math.max(a,v));};
  o.mode=['browser','usb','serial','ble','net','queue'].includes(o.mode)?o.mode:'browser';
  o.lang=['tspl','zpl','escpos','epl'].includes(o.lang)?o.lang:'tspl';o.eplDir=['T','B'].includes(o.eplDir)?o.eplDir:'';
  o.dpi=[203,300,600].includes(+o.dpi)?+o.dpi:203;
  o.media=['gap','mark','cont'].includes(o.media)?o.media:'gap';
  o.gap=cl(o.gap,0,20,2);o.density=Math.round(cl(o.density,0,15,8));o.speed=Math.round(cl(o.speed,1,10,4));
  o.baud=[9600,19200,38400,57600,115200,230400].includes(+o.baud)?+o.baud:115200;
  o.port=Math.round(cl(o.port,1,65535,9100));o.invert=!!o.invert;
  ['bridgeUrl','ip','queue','token','usbId'].forEach(k=>{o[k]=String(o[k]==null?'':o[k]).trim().slice(0,120);});

}

const rtlRx=/[\u0590-\u08FF\uFB1D-\uFDFF\uFE70-\uFEFF]/;

/* ---- render label to a canvas at printer resolution ---- */
async function renderLabelCanvas(p,L,dpi){
  try{if(document.fonts&&document.fonts.ready)await document.fonts.ready;}catch(e){}
  const k=dpi/25.4,W=Math.max(8,Math.round(L.w*k)),H=Math.max(8,Math.round(L.h*k));
  const cv=document.createElement('canvas');cv.width=W;cv.height=H;
  const x=cv.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,W,H);x.fillStyle='#000';x.strokeStyle='#000';
  L.els.forEach(e=>{
    x.save();
    x.translate((e.x+e.w/2+(L.offX||0))*k,(e.y+e.h/2+(L.offY||0))*k);x.rotate((e.r||0)*Math.PI/180);
    const w=e.w*k,h=e.h*k;
    x.beginPath();x.rect(-w/2,-h/2,w,h);x.clip();
    try{
      if(e.t==='line')x.fillRect(-w/2,-h/2,w,h);
      else if(e.t==='rect'){const lw=Math.max(1,(e.bw||0.3)*k);x.lineWidth=lw;x.strokeRect(-w/2+lw/2,-h/2+lw/2,w-lw,h-lw);}
      else if(e.t==='code')drawCodeCanvas(x,p,L,w,h);
      else drawTextCanvas(x,p,L,e,w,h,dpi);
    }catch(er){}
    x.restore();
  });
  if(L.printRot===180){
    const c2=document.createElement('canvas');c2.width=W;c2.height=H;const y=c2.getContext('2d');
    y.fillStyle='#fff';y.fillRect(0,0,W,H);y.translate(W,H);y.rotate(Math.PI);y.drawImage(cv,0,0);return c2;
  }
  return cv;
}
function drawCodeCanvas(x,p,L,w,h){
  const pay=codePayload(p,L);if(!pay)return;
  if(L.fmt==='qr'){
    if(typeof qrcode==='undefined')return;
    try{if(qrcode.stringToBytesFuncs&&qrcode.stringToBytesFuncs['UTF-8'])qrcode.stringToBytes=qrcode.stringToBytesFuncs['UTF-8'];}catch(e){}
    const q=qrcode(0,L.ec||'M');q.addData(String(pay));q.make();
    const n=q.getModuleCount(),z=Math.max(0,+L.qz||0),t=n+2*z;
    let sc=Math.min(w,h)/t;if(sc>=1.5)sc=Math.floor(sc);
    const ox=-t*sc/2+z*sc,oy=-t*sc/2+z*sc;
    x.fillStyle='#fff';x.fillRect(-t*sc/2,-t*sc/2,t*sc,t*sc);x.fillStyle='#000';
    for(let r=0;r<n;r++)for(let c=0;c<n;c++)if(q.isDark(r,c))x.fillRect(Math.round(ox+c*sc),Math.round(oy+r*sc),Math.ceil(sc),Math.ceil(sc));
  }else{
    if(typeof JsBarcode==='undefined')return;
    const want=L.fmt==='EAN13'?'EAN13':L.fmt==='CODE128'?'CODE128':(/^\d{13}$/.test(pay)?'EAN13':'CODE128');
    const tmp=document.createElement('canvas');
    const mk=(fmt,bw)=>JsBarcode(tmp,pay,{format:fmt,width:bw,height:100,margin:0,displayValue:false});
    try{mk(want,1);}catch(e){mk('CODE128',1);}
    const modules=tmp.width,bw=Math.max(1,Math.floor(w/modules));
    try{mk(want,bw);}catch(e){mk('CODE128',bw);}
    x.imageSmoothingEnabled=false;
    const dw=Math.min(w,tmp.width);x.drawImage(tmp,-dw/2,-h/2,dw,h);
  }
}
function drawTextCanvas(x,p,L,e,w,h,dpi){
  const t=renderTpl(e.text,p,L);if(!t)return;
  const base=Math.max(6,e.fs*dpi/72),minF=Math.max(6,base*0.4);
  const setFont=f=>{x.font=(e.i?'italic ':'')+(e.b?'700':'500')+' '+f+"px 'IBM Plex Sans Arabic','Segoe UI',Tahoma,sans-serif";};
  x.textBaseline='middle';x.fillStyle='#000';
  x.direction=rtlRx.test(t)?'rtl':'ltr';
  const al=e.al==='right'?'right':e.al==='center'?'center':'left';
  x.textAlign=al;
  const ax=al==='left'?-w/2:al==='right'?w/2:0;
  const layout=(f,fw)=>{
    setFont(f);
    if(!(e.wr||fw))return [t];
    const lines=[],words=t.split(/\s+/);let cur='';
    words.forEach(wd=>{
      const tryS=cur?cur+' '+wd:wd;
      if(x.measureText(tryS).width<=w)cur=tryS;
      else{if(cur)lines.push(cur);cur=wd;while(x.measureText(cur).width>w&&cur.length>1){let i=cur.length-1;while(i>1&&x.measureText(cur.slice(0,i)).width>w)i--;lines.push(cur.slice(0,i));cur=cur.slice(i);}}
    });
    if(cur)lines.push(cur);
    return lines;
  };
  let f=base,lines=layout(f);
  const fits=()=>e.wr?(lines.length*f*1.1<=h+0.5):(x.measureText(lines[0]).width<=w+0.5);
  while(!fits()&&f>minF){f=Math.max(minF,f-0.5);lines=layout(f);}
  setFont(f);
  if(!e.wr&&x.measureText(lines[0]).width>w&&h>=minF*2.2){
    let f2=base,l2=layout(f2,true);
    while(l2.length*f2*1.1>h+0.5&&f2>minF){f2=Math.max(minF,f2-0.5);l2=layout(f2,true);}
    if(l2.length*f2*1.1<=h+0.5){f=f2;lines=l2;setFont(f);}
  }
  if(!e.wr&&x.measureText(lines[0]).width>w){let v=lines[0];while(v.length>1&&x.measureText(v+'…').width>w)v=v.slice(0,-1);lines=[v+'…'];}
  const lh=f*1.1,tot=lines.length*lh;
  lines.forEach((ln,i)=>{const yy=-tot/2+(i+.5)*lh;x.fillText(ln,ax,yy);if(e.u){const tw=x.measureText(ln).width,x0=al==='left'?ax:al==='right'?ax-tw:ax-tw/2;x.fillRect(x0,yy+f*0.5,tw,Math.max(1,f/14));}});
}

/* ---- 1-bit bitmap + printer languages ---- */
function canvasBits(cv,blackIs1,thr){
  const W=cv.width,H=cv.height,d=cv.getContext('2d').getImageData(0,0,W,H).data,bpr=Math.ceil(W/8);
  const out=new Uint8Array(bpr*H);
  if(!blackIs1)out.fill(0xFF);
  for(let y=0;y<H;y++)for(let xx=0;xx<W;xx++){
    const i=(y*W+xx)*4,lum=0.299*d[i]+0.587*d[i+1]+0.114*d[i+2],black=d[i+3]>128&&lum<(Math.max(10,Math.min(95,thr||65))/100*255);
    if(black){if(blackIs1)out[y*bpr+(xx>>3)]|=0x80>>(xx&7);else out[y*bpr+(xx>>3)]&=~(0x80>>(xx&7));}
  }
  return{bits:out,bpr,w:W,h:H};
}
const _te=new TextEncoder();
const catBytes=(...a)=>{const o=new Uint8Array(a.reduce((n,b)=>n+b.length,0));let i=0;a.forEach(b=>{o.set(b,i);i+=b.length;});return o;};
function encTSPL(cv,L,PS,n){
  const b=canvasBits(cv,PS.invert,L.thr);
  const media=PS.media==='gap'?`GAP ${PS.gap} mm,0 mm\r\n`:PS.media==='mark'?`BLINE ${PS.gap} mm,0 mm\r\n`:'GAP 0 mm,0 mm\r\n';
  const head=`SIZE ${rd(L.w,1)} mm,${rd(L.h,1)} mm\r\n${media}DIRECTION 0\r\nREFERENCE 0,0\r\nDENSITY ${PS.density}\r\nSPEED ${PS.speed}\r\nCLS\r\nBITMAP 0,0,${b.bpr},${b.h},0,`;
  return catBytes(_te.encode(head),b.bits,_te.encode(`\r\nPRINT ${n},1\r\n`));
}
function encZPL(cv,L,PS,n){
  const b=canvasBits(cv,!PS.invert,L.thr);let hex='';
  for(let i=0;i<b.bits.length;i++)hex+=(b.bits[i]<16?'0':'')+b.bits[i].toString(16);
  const tot=b.bits.length,mn=PS.media==='gap'?'Y':PS.media==='mark'?'M':'N';
  return _te.encode(`~SD${Math.min(30,PS.density*2)}\n^XA\n^MN${mn}\n^PW${b.w}\n^LL${b.h}\n^LH0,0\n^PR${PS.speed}\n^FO0,0^GFA,${tot},${tot},${b.bpr},${hex.toUpperCase()}^FS\n^PQ${n}\n^XZ\n`);
}
function encESC(cv,L,PS,n){
  const b=canvasBits(cv,!PS.invert,L.thr),one=[];
  for(let y0=0;y0<b.h;y0+=240){
    const hh=Math.min(240,b.h-y0);
    one.push(new Uint8Array([0x1D,0x76,0x30,0x00,b.bpr&255,b.bpr>>8,hh&255,hh>>8]),b.bits.subarray(y0*b.bpr,(y0+hh)*b.bpr));
  }
  const parts=[new Uint8Array([0x1B,0x40])];
  for(let i=0;i<n;i++){one.forEach(x=>parts.push(x));parts.push(new Uint8Array([0x0A,0x0A]));}
  return catBytes(...parts);
}
function encEPL(cv,L,PS,n){
  const b=canvasBits(cv,PS.invert,L.thr);
  const gapD=PS.media==='cont'?0:Math.round(PS.gap*PS.dpi/25.4),wDots=b.bpr*8,spd=Math.max(1,Math.min(4,Math.ceil(PS.speed/2.5)));
  const dir=PS.eplDir==='T'?'ZT\n':PS.eplDir==='B'?'ZB\n':'';
  const head=_te.encode(`\nN\n${dir}q${wDots}\nQ${b.h},${gapD}\nS${spd}\nD${PS.density}\nR0,0\nGW0,0,${b.bpr},${b.h},`);
  return catBytes(head,b.bits,_te.encode(`\nP${n}\n`));
}
const encodeJob=(cv,L,PS,n)=>({tspl:encTSPL,zpl:encZPL,escpos:encESC,epl:encEPL}[PS.lang]||encTSPL)(cv,L,PS,n);

/* ---- transports ---- */
async function prnSend(bytes,PS){
  if(PS.mode==='serial'){
    if(!PRN.port)throw new Error('الطابعة غير متصلة. اختر الطابعة من الإعدادات ← الطابعة.');
    const w=PRN.port.writable.getWriter();
    try{for(let i=0;i<bytes.length;i+=4096)await w.write(bytes.subarray(i,i+4096));}finally{w.releaseLock();}
  }else if(PS.mode==='usb'){
    const u=PRN.usb;if(!u)throw new Error('الطابعة غير متصلة. اختر الطابعة من الإعدادات ← الطابعة.');
    for(let i=0;i<bytes.length;i+=16384){const r=await u.dev.transferOut(u.ep,bytes.subarray(i,i+16384));if(r.status&&r.status!=='ok')throw new Error('فشل الإرسال عبر USB ('+r.status+')');}
  }else if(PS.mode==='ble'){
    const b=PRN.ble;if(!b||!b.dev.gatt.connected)throw new Error('انقطع اتصال البلوتوث. أعد اختيار الطابعة.');
    for(let i=0;i<bytes.length;i+=100){
      const part=bytes.subarray(i,i+100);
      if(b.ch.properties.writeWithoutResponse&&b.ch.writeValueWithoutResponse)await b.ch.writeValueWithoutResponse(part);else await b.ch.writeValue(part);
      await sleepMs(8);
    }
  }else{
    const h={'Content-Type':'application/octet-stream'};
    if(PS.mode==='net'){if(!PS.ip)throw new Error('أدخل عنوان IP للطابعة.');h['X-Printer-Host']=PS.ip;h['X-Printer-Port']=String(PS.port);}
    else{if(!PS.queue)throw new Error('أدخل اسم الطابعة المثبّتة.');h['X-Printer-Name']=PS.queue;}
    if(PS.token)h['X-Bridge-Token']=PS.token;
    let r;
    try{r=await fetch(PS.bridgeUrl.replace(/\/+$/,'')+'/print',{method:'POST',headers:h,body:bytes});}
    catch(e){throw new Error('تعذّر الاتصال بوسيط الطباعة ('+PS.bridgeUrl+'). تأكد من تشغيله على هذا الجهاز.');}
    if(!r.ok){let m='';try{m=(await r.json()).error;}catch(e){}throw new Error(m||('خطأ من الوسيط '+r.status));}
  }
}

  PRN.id=dev.serialNumber?(String(dev.manufacturerName||'USB').split(' ')[0]+'-USB-'+dev.serialNumber):'';

async function prnConnect(){

    const p=await navigator.serial.requestPort();await p.open({baudRate:PS.baud});PRN.port=p;PRN.name='منفذ تسلسلي ('+PS.baud+')';
  }else if(PS.mode==='usb'){
    if(!navigator.usb)throw new Error('المتصفح لا يدعم USB (استخدم Chrome أو Edge).');
    const dev=await navigator.usb.requestDevice({filters:[]});
    await usbAttach(dev,PS);
    PS.usbId=dev.vendorId+':'+dev.productId;save();

    dev.addEventListener('gattserverdisconnected',()=>{PRN.ble=null;if(view==='prefs')render();});

  }
}
async function prnDisconnect(){

  try{if(PRN.usb){await PRN.usb.dev.close();}}catch(e){}

async function prnAutoReconnect(){
  const PS=S.settings.printer;

    if(PS.mode==='serial'&&navigator.serial){const ps=await navigator.serial.getPorts();if(ps.length===1){await ps[0].open({baudRate:PS.baud});PRN.port=ps[0];PRN.name='منفذ تسلسلي ('+PS.baud+')';}}

      const ds=await navigator.usb.getDevices(),dv=ds.find(d=>d.vendorId+':'+d.productId===PS.usbId);

    }
  }catch(e){}
}

const BRIDGE_PY="#!/usr/bin/env python3\n# -*- coding: utf-8 -*-\n\"\"\"\nوسيط طباعة جرد الذهب (Jard Print Bridge) - الإصدار 1.0\nيستقبل أوامر الطابعة الخام (TSPL / ZPL / ESC-POS) من منصة جرد الذهب في المتصفح\nويمررها إلى الطابعة، لأن المتصفح لا يستطيع الاتصال بعنوان IP مباشرة.\n\nالاستخدام (لا يحتاج تثبيت مكتبات، Python 3.8 فأحدث):\n    python jard-print-bridge.py                      تشغيل على المنفذ 9101\n    python jard-print-bridge.py --token سري123       اشتراط رمز في كل طلب\n    python jard-print-bridge.py --origin https://موقعك.com   السماح لموقعك فقط\n\nوضع الشبكة:  المنصة ترسل عنوان IP والمنفذ (غالبًا 9100) والوسيط يمرر البيانات.\nوضع الطابور: يمرر البيانات لطابعة مثبّتة على الجهاز بتعريفها (ويندوز: يجب مشاركة الطابعة\n              باسم مشاركة، لينكس/ماك: أمر lp -o raw).\nالأمان: يستمع على 127.0.0.1 فقط، ويقبل عناوين الشبكة المحلية فقط، ولا يحفظ أي بيانات.\n\"\"\"\nimport argparse\nimport ipaddress\nimport json\nimport os\nimport platform\nimport re\nimport socket\nimport subprocess\nimport sys\nimport tempfile\nfrom http.server import BaseHTTPRequestHandler, ThreadingHTTPServer\n\nVERSION = \"1.0\"\nMAX_BYTES = 20 * 1024 * 1024\n\n\ndef check_host(host):\n    try:\n        ip = ipaddress.ip_address(socket.gethostbyname(host))\n    except Exception:\n        raise ValueError(\"تعذّر تحديد عنوان الطابعة: \" + host)\n    if not (ip.is_private or ip.is_loopback or ip.is_link_local):\n        raise ValueError(\"يُسمح بعناوين الشبكة المحلية فقط\")\n    return str(ip)\n\n\ndef send_tcp(host, port, data):\n    ip = check_host(host)\n    if not (1 <= port <= 65535):\n        raise ValueError(\"منفذ غير صالح\")\n    with socket.create_connection((ip, port), timeout=6) as s:\n        s.settimeout(15)\n        s.sendall(data)\n        try:\n            s.shutdown(socket.SHUT_WR)\n        except OSError:\n            pass\n\n\ndef send_queue(name, data):\n    if not re.fullmatch(r\"[\\w .\\-()]{1,80}\", name, re.UNICODE):\n        raise ValueError(\"اسم الطابعة يحتوي رموزًا غير مسموحة\")\n    fd, path = tempfile.mkstemp(prefix=\"jard-\", suffix=\".prn\")\n    try:\n        with os.fdopen(fd, \"wb\") as f:\n            f.write(data)\n        if platform.system() == \"Windows\":\n            target = \"\\\\\\\\localhost\\\\\" + name\n            r = subprocess.run([\"cmd\", \"/c\", \"copy\", \"/b\", path, target], capture_output=True, timeout=30)\n        else:\n            r = subprocess.run([\"lp\", \"-d\", name, \"-o\", \"raw\", path], capture_output=True, timeout=30)\n        if r.returncode != 0:\n            msg = (r.stderr or r.stdout or b\"\").decode(errors=\"ignore\").strip()\n            raise RuntimeError(\"فشل الإرسال إلى طابور الطباعة: \" + (msg or str(r.returncode)))\n    finally:\n        try:\n            os.remove(path)\n        except OSError:\n            pass\n\n\nclass Handler(BaseHTTPRequestHandler):\n    server_version = \"JardBridge/\" + VERSION\n\n    def log_message(self, fmt, *args):\n        sys.stderr.write(\"[bridge] \" + (fmt % args) + \"\\n\")\n\n    def _cors(self):\n        origin = self.headers.get(\"Origin\")\n        allowed = self.server.origins\n        if allowed:\n            allow = origin if origin in allowed else allowed[0]\n        else:\n            allow = origin or \"*\"\n        self.send_header(\"Access-Control-Allow-Origin\", allow)\n        self.send_header(\"Vary\", \"Origin\")\n        self.send_header(\"Access-Control-Allow-Methods\", \"GET, POST, OPTIONS\")\n        self.send_header(\"Access-Control-Allow-Headers\",\n                         \"Content-Type, X-Printer-Host, X-Printer-Port, X-Printer-Name, X-Bridge-Token\")\n        self.send_header(\"Access-Control-Allow-Private-Network\", \"true\")\n        self.send_header(\"Access-Control-Max-Age\", \"600\")\n\n    def _json(self, code, obj):\n        body = json.dumps(obj, ensure_ascii=False).encode(\"utf-8\")\n        self.send_response(code)\n        self._cors()\n        self.send_header(\"Content-Type\", \"application/json; charset=utf-8\")\n        self.send_header(\"Content-Length\", str(len(body)))\n        self.end_headers()\n        self.wfile.write(body)\n\n    def do_OPTIONS(self):\n        self.send_response(204)\n        self._cors()\n        self.send_header(\"Content-Length\", \"0\")\n        self.end_headers()\n\n    def do_GET(self):\n        if self.path.split(\"?\")[0] == \"/ping\":\n            return self._json(200, {\"ok\": True, \"bridge\": VERSION, \"os\": platform.system()})\n        self._json(404, {\"error\": \"غير موجود\"})\n\n    def do_POST(self):\n        if self.path.split(\"?\")[0] != \"/print\":\n            return self._json(404, {\"error\": \"غير موجود\"})\n        if self.server.token and self.headers.get(\"X-Bridge-Token\") != self.server.token:\n            return self._json(401, {\"error\": \"رمز الوسيط غير صحيح\"})\n        try:\n            n = int(self.headers.get(\"Content-Length\", \"0\") or 0)\n        except ValueError:\n            n = 0\n        if n <= 0 or n > MAX_BYTES:\n            return self._json(413, {\"error\": \"حجم البيانات غير صالح\"})\n        data = self.rfile.read(n)\n        host = (self.headers.get(\"X-Printer-Host\") or \"\").strip()\n        name = (self.headers.get(\"X-Printer-Name\") or \"\").strip()\n        try:\n            if host:\n                send_tcp(host, int(self.headers.get(\"X-Printer-Port\", \"9100\") or 9100), data)\n            elif name:\n                send_queue(name, data)\n            else:\n                return self._json(400, {\"error\": \"حدّد عنوان الطابعة أو اسمها\"})\n        except Exception as e:  # noqa\n            return self._json(502, {\"error\": str(e)})\n        self._json(200, {\"ok\": True, \"bytes\": len(data)})\n\n\ndef main():\n    ap = argparse.ArgumentParser(description=\"وسيط طباعة جرد الذهب\")\n    ap.add_argument(\"--host\", default=\"127.0.0.1\")\n    ap.add_argument(\"--port\", type=int, default=9101)\n    ap.add_argument(\"--token\", default=\"\")\n    ap.add_argument(\"--origin\", action=\"append\", default=[], help=\"السماح لموقع محدد فقط (يمكن تكراره)\")\n    a = ap.parse_args()\n    srv = ThreadingHTTPServer((a.host, a.port), Handler)\n    srv.token = a.token\n    srv.origins = a.origin\n    print(\"وسيط الطباعة يعمل على http://%s:%d  (اضغط Ctrl+C للإيقاف)\" % (a.host, a.port))\n    try:\n        srv.serve_forever()\n    except KeyboardInterrupt:\n        print(\"\\nتم الإيقاف\")\n\n\nif __name__ == \"__main__\":\n    main()\n";

const IX_EVENTS=[['piece.created','إضافة قطعة'],['piece.updated','تعديل قطعة'],['piece.deleted','حذف قطعة'],['piece.sold','بيع قطعة'],['sale.created','فاتورة بيع'],['sale.deleted','حذف فاتورة'],['expense.created','مصروف'],['count.closed','إنهاء جرد']];
const INTEG_DEF=()=>({hooks:[],acct:{cash:'1100',cashN:'الصندوق / البنك',sales:'4100',salesN:'إيرادات المبيعات',vat:'2200',vatN:'ضريبة القيمة المضافة المستحقة',cogs:'5100',cogsN:'تكلفة البضاعة المباعة',inv:'1300',invN:'المخزون',exp:'6100',expN:'مصروفات تشغيلية',ap:'2100',apN:'الموردون / الدائنون'},feed:{fmt:'shopify',vatIncl:true,sold:false,secret:false,vendor:''}});
function normInteg(o){
  const d=INTEG_DEF(),x=o&&typeof o==='object'?o:{};
  const ev=new Set(IX_EVENTS.map(e=>e[0]));
  const hooks=(Array.isArray(x.hooks)?x.hooks:[]).filter(h=>h&&typeof h==='object').map(h=>({id:String(h.id||uid()),name:String(h.name||'ربط').slice(0,60),url:String(h.url||'').trim().slice(0,500),secret:String(h.secret||'').slice(0,200),on:h.on!==false,compat:!!h.compat,events:(Array.isArray(h.events)?h.events:[]).filter(e=>ev.has(e))}));
  const acct=Object.assign({},d.acct);Object.keys(d.acct).forEach(k=>{if(x.acct&&x.acct[k]!=null)acct[k]=String(x.acct[k]).slice(0,60);});

  return{hooks,acct,feed:f};

/* ---- webhook delivery queue ---- */
let OB=null,obBusy=false,obAgain=false;
const obLoad=()=>{if(OB===null){try{OB=JSON.parse(localStorage.getItem('jard.outbox')||'[]');}catch(e){OB=[];}if(!Array.isArray(OB))OB=[];}return OB;};
const obSave=()=>{try{localStorage.setItem('jard.outbox',JSON.stringify(obLoad().slice(-500)));}catch(e){}};
function hookLog(h,ev,ok,msg){
  let L=[];try{L=JSON.parse(localStorage.getItem('jard.hooklog')||'[]');}catch(e){}
  L.unshift({t:new Date().toISOString(),hook:h.name,event:ev.event,ok,msg:msg||''});
  try{localStorage.setItem('jard.hooklog',JSON.stringify(L.slice(0,50)));}catch(e){}
}
function emitEvent(type,data){
  try{
    const I=S.settings.integ;if(!I||!I.hooks.length||!data)return;
    const ev={id:uid(),event:type,ts:new Date().toISOString(),shop:S.settings.shop||'',currency:cur(),version:1,app_version:APP_VERSION,data};
    let n=0;
    I.hooks.forEach(h=>{if(h.on&&h.url&&h.events.includes(type)){obLoad().push({id:uid(),hook:h.id,ev,tries:0,next:0});n++;}});
    if(n){obSave();flushOutbox();}
  }catch(e){}
}
async function hmacHex(secret,msg){
  if(!(window.crypto&&crypto.subtle))throw Object.assign(new Error('التوقيع يتطلب HTTPS'),{status:0,permanent:true});
  const enc=new TextEncoder(),k=await crypto.subtle.importKey('raw',enc.encode(secret),{name:'HMAC',hash:'SHA-256'},false,['sign']);
  return [...new Uint8Array(await crypto.subtle.sign('HMAC',k,enc.encode(msg)))].map(b=>b.toString(16).padStart(2,'0')).join('');
}
async function hookDeliver(h,ev){
  const body=JSON.stringify(ev);let init;
  if(h.compat){
    const o=Object.assign({},ev);if(h.secret)o.signature='sha256='+await hmacHex(h.secret,body);
    init={method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=UTF-8'},body:JSON.stringify(o)};
  }else{
    const headers={'Content-Type':'application/json','X-Jard-Event':ev.event,'X-Jard-Delivery':ev.id};
    if(h.secret)headers['X-Jard-Signature']='sha256='+await hmacHex(h.secret,body);
    init={method:'POST',headers,body};
  }
  const ctl=typeof AbortController!=='undefined'?new AbortController():null,to=setTimeout(()=>{if(ctl)ctl.abort();},15000);
  try{
    const r=await fetch(h.url,Object.assign(init,{signal:ctl?ctl.signal:undefined}));
    if(!h.compat&&!r.ok){const e=new Error('HTTP '+r.status);e.status=r.status;throw e;}
  }catch(e){
    if(!e.status&&!e.permanent)e.message=e.name==='AbortError'?'انتهت المهلة':'تعذّر الاتصال (تحقق من الرابط وسياسة CORS، أو فعّل وضع التوافق)';
    throw e;
  }finally{clearTimeout(to);}
}
async function flushOutbox(){
  if(obBusy){obAgain=true;return;}
  obBusy=true;
  try{
    do{
      obAgain=false;
      const ob=obLoad();
      for(const it of ob.slice()){
        if(it.next>Date.now())continue;
        const h=((S.settings.integ||{}).hooks||[]).find(x=>x.id===it.hook);
        if(!h||!h.on){ob.splice(ob.indexOf(it),1);continue;}
        try{await hookDeliver(h,it.ev);ob.splice(ob.indexOf(it),1);hookLog(h,it.ev,true,'');}
        catch(e){
          it.tries++;
          const perm=e.permanent||(e.status>=400&&e.status<500&&![408,425,429].includes(e.status));
          if(perm||it.tries>=10){ob.splice(ob.indexOf(it),1);hookLog(h,it.ev,false,(perm?'رُفض نهائيًا: ':'توقفت المحاولات: ')+e.message);}
          else{it.next=Date.now()+Math.min(3600e3,15e3*Math.pow(2,it.tries-1));hookLog(h,it.ev,false,e.message+' (محاولة '+it.tries+')');}
        }
      }
      obSave();
    }while(obAgain);
  }finally{obBusy=false;}
  if(view==='prefs'&&prefTab==='integ')paintHookLog();
}
setInterval(()=>{if(obLoad().length)flushOutbox();},20000);

function countScan(raw){

  else{
    pid=p.id;
    if(c.scans.some(x=>x.pid===pid&&(x.st==='ok'||x.st==='extra')))st='dup';
    else if(p.status==='sold')st='sold';
    else if(c.expected.includes(pid))st='ok';

  }
  c.scans.push({pid,code,at:new Date().toISOString(),st});
  save();
  const info=p?`${esc(dname(p))} · عيار ${esc(p.karat)} · ${fmtW(p.weight)} جم · <span class="mono">${esc(p.serial||p.barcode)}</span>`:`<span class="mono">${esc(code)}</span>`;
  const msg={ok:'✓ مطابقة',dup:'↺ مسوحة مسبقًا',sold:'✕ القطعة مباعة'+(p&&p.invNo?' (فاتورة '+esc(p.invNo)+')':''),extra:'＋ موجودة في المخزون لكن خارج نطاق الجرد',unknown:'? باركود غير مسجّل في المنصة'}[st];

function submitPiece(f,p,mode){

  if(!nodeId||!leavesFor(karat).some(n=>n.id===nodeId)){err(mode==='intake'?'أكمل اختيار الصنف من الخطوات أعلاه.':'اختر الصنف المناسب للعيار.');return;}

  if(dup){err('هذا الباركود موجود مسبقًا ('+dname(dup)+' · '+fmtW(dup.weight)+' جم'+(dup.serial?' · '+dup.serial:'')+').');return;}
  if(p._gen&&!serial){err('الرقم التسلسلي مطلوب.');f.elements.serial.focus();return;}
  const sdup=serial&&S.pieces.find(x=>x.id!==p.id&&x.serial===serial);
  if(sdup){err('الرقم التسلسلي «'+serial+'» مستخدم لقطعة أخرى ('+dname(sdup)+').');return;}
  const o={barcode:bc,serial,karat,aud,nodeId,used:fd.get('used')==='1',name:String(fd.get('name')||'').trim(),weight:r3(weight),size:latin(String(fd.get('size')||'').trim()),
    wage:r2(num(fd.get('wage'))),buyPpg:r2(num(fd.get('buyPpg'))),cost:r2(num(fd.get('cost'))),sellPpg:r2(num(fd.get('sellPpg'))),sellAmt:r2(num(fd.get('sellAmt'))),

  if(p._extCode)o.extCode=String(p._extCode).slice(0,120);
  let newSaved=null;
  const pItem=q=>({pid:q.id,name:dname(q),barcode:q.barcode,serial:q.serial,karat:q.karat,nodeId:q.nodeId,cat:pathOf(q.nodeId),aud:q.aud||'',used:q.used,weight:q.weight,size:q.size,wage:q.wage,buyPpg:q.buyPpg,amount:q.cost});
  if(!p.id){
    const saved=Object.assign({id:uid(),created:new Date().toISOString(),status:'in'},o);
    newSaved=saved;S.pieces.push(saved);bumpSerial(saved.serial);
    S.txs.push({id:uid(),date:saved.created,type:'purchase',items:[pItem(saved)],total:saved.cost});
  }else{
    const saved=piece(p.id);Object.assign(saved,o);
    const tx=S.txs.find(t=>t.type==='purchase'&&t.items[0]&&t.items[0].pid===saved.id);
    if(tx){tx.total=saved.cost;tx.items[0]=pItem(saved);}
  }

  save();
  emitEvent(newSaved?'piece.created':'piece.updated',pieceOut(newSaved||piece(p.id)));
  const bulk=!!(mode==='intake'&&newSaved&&p._gen&&genBulk);
  if(mode==='intake'&&newSaved&&(S.settings.label.autoPrint||pr_||bulk))setTimeout(()=>printLabels([newSaved],1),bulk?30:50);
  if(bulk){draft=nextBulkDraft(newSaved);editingExisting=false;renderDraft();renderRecent();toast('تم الحفظ والطباعة · '+(newSaved.serial||newSaved.barcode));}
  else if(mode==='intake'){draft=null;editingExisting=false;renderDraft();renderRecent();toast('تم حفظ القطعة');const i=$('#scanIn');if(i&&fine())i.focus();}
  else{closeDlg();toast('تم حفظ التغييرات');render();}
}

function codePayload(p,L){
  L=L||S.settings.label;
  if(L.codeMode!=='tpl')return p.barcode||'';
  if(!L.codeTpl)return '';
  const kvf=S.settings.bfmt.kv.fields;
  const val=f=>{if(String(f).startsWith('x:'))return String((p.extra||{})[f.slice(2)]||'');switch(f){
    case 'weight':return String(rd(p.weight,3));
    case 'karat':return String(p.karat);
    case 'size':return String(p.size||'');
    case 'makingCharge':return String(rd(p.wage,2));
    case 'buyPpg':return String(rd(p.buyPpg,2));
    case 'purchasePrice':return String(rd(p.cost,2));
    case 'serialNumber':return String(p.serial||p.barcode||'');
    case 'aud':return String(p.aud||'');
    case 'name':return String(p.name||'');
    case 'cond':return p.used?'used':'new';
    case 'price':{const sp=calc(p);return sp.total>0?String(rd(sp.total,2)):'';}
    case 'cat':return pathOf(p.nodeId)||'';
    case 'shop':return S.settings.shop||'';
    case 'wageTotal':return (p.wage>0&&p.weight>0)?String(rd(p.wage*p.weight,2)):'';
  }return '';};
  return L.codeTpl.replace(/([a-zA-Z]+)\{\}/g,(m,key)=>{
    const c=kvf.find(f=>f.key===key)||kvf.find(f=>f.key.toLowerCase()===key.toLowerCase());
    if(!c)return m;const v=val(c.field);return v===''?'':key+'{'+v+'}';
  });
}
function tokenVal(p,key,L){
  if(key.startsWith('x:'))return String((p.extra||{})[key.slice(2)]||'');
  const sp=calc(p);
  switch(key){
    case 'price':return sp.total>0?fmt(sp.total):'';
    case 'cur':return cur();
    case 'shop':return S.settings.shop||'';
    case 'karat':return p.karat?String(p.karat):'';
    case 'cond':return p.used?'مستعمل':'';
    case 'aud':return p.aud?String(p.aud):'';
    case 'state':return p.used?'مستعمل':'جديد';
    case 'weight':return p.weight>0?fmtW(p.weight):'';
    case 'size':return p.size?String(p.size):'';
    case 'wage':return p.wage>0?fmt(p.wage):'';
    case 'wageTotal':return (p.wage>0&&p.weight>0)?fmt(p.wage*p.weight):'';
    case 'serial':return p.serial?String(p.serial):'';
    case 'name':return dname(p);
    case 'cat':return pathOf(p.nodeId)||'';
    case 'barcode':return p.barcode||'';
    case 'code':return codePayload(p,L);
  }
  return null;
}
function renderTpl(str,p,L){
  let tokens=0,filled=0;
  const out=String(str||'').replace(/\{([A-Za-z0-9_:]+)\}/g,(m,key)=>{
    const v=tokenVal(p,key,L);if(v===null)return m;
    if(key!=='cur'){tokens++;if(v!=='')filled++;}
    return v;
  });
  if(tokens&&!filled)return '';
  return out.replace(/\s+/g,' ').trim();
}
function elHTML(p,e,L){
  const st=`left:${e.x}mm;top:${e.y}mm;width:${e.w}mm;height:${e.h}mm;transform:rotate(${e.r||0}deg)`;
  if(e.t==='rect')return `<div class="le" style="${st};border:${e.bw||0.3}mm solid #000"></div>`;
  if(e.t==='line')return `<div class="le" style="${st};background:#000"></div>`;

  }

const qrCache={};
function qrSvg(text,ec,qz){
  if(typeof qrcode==='undefined')throw new Error('noqr');
  const key=ec+'|'+qz+'|'+text;if(qrCache[key])return qrCache[key];
  try{if(qrcode.stringToBytesFuncs&&qrcode.stringToBytesFuncs['UTF-8'])qrcode.stringToBytes=qrcode.stringToBytesFuncs['UTF-8'];}catch(e){}
  const q=qrcode(0,ec||'M');q.addData(String(text));q.make();
  const n=q.getModuleCount(),z=Math.max(0,+qz||0),t=n+2*z;let d='';
  for(let r=0;r<n;r++)for(let c=0;c<n;c++)if(q.isDark(r,c))d+='M'+c+','+r+'h1v1h-1z';
  const out=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="${-z} ${-z} ${t} ${t}" style="width:100%;height:100%;display:block" shape-rendering="crispEdges"><rect x="${-z}" y="${-z}" width="${t}" height="${t}" fill="#fff"/><path d="${d}" fill="#000"/></svg>`;
  qrCache[key]=out;return out;
}
function fitLabelText(root){
  if(!root||!root.querySelectorAll)return;
  let restore=null,touched=false;
  try{
    if(root.offsetParent===null&&getComputedStyle(root).display==='none'){restore=root.getAttribute('style');touched=true;root.style.cssText+=';display:block!important;position:fixed;left:-99999px;top:0;';}
    root.querySelectorAll('.lt2').forEach(box=>{
      const sp=box.querySelector('.lts');if(!sp||!box.clientWidth)return;
      const wrap=sp.style.whiteSpace==='normal';
      let fs=parseFloat(box.style.fontSize);if(!fs)return;
      const min=Math.max(4,fs*0.4);
      const over=()=>wrap?(sp.scrollHeight>box.clientHeight+1):(sp.scrollWidth>box.clientWidth+1);
      let guard=0;
      while(over()&&fs>min&&guard++<40){fs=Math.max(min,fs-0.5);box.style.fontSize=fs+'pt';}
    });
  }catch(e){}
  if(touched){if(restore)root.setAttribute('style',restore);else root.removeAttribute('style');}
}
function drawLabelBarcodes(root,L){
  L=L||S.settings.label;
  fitLabelText(root);
  root.querySelectorAll('.qrbox[data-qr]').forEach(b=>{
    try{b.innerHTML=qrSvg(b.dataset.qr,L.ec,L.qz);}catch(e){b.textContent=b.dataset.qr;}
  });
  root.querySelectorAll('svg.lbc').forEach(svg=>{
    const code=svg.dataset.code;
    try{
      if(typeof JsBarcode==='undefined')throw new Error('nolib');
      const want=L.fmt==='EAN13'?'EAN13':L.fmt==='CODE128'?'CODE128':(/^\d{13}$/.test(code)?'EAN13':'CODE128');
      const opt={height:100,width:2,margin:0,displayValue:false};
      try{JsBarcode(svg,code,Object.assign({format:want},opt));}catch(e){JsBarcode(svg,code,Object.assign({format:'CODE128'},opt));}
      const w=parseFloat(svg.getAttribute('width')),h=parseFloat(svg.getAttribute('height'));
      if(w&&h){svg.setAttribute('viewBox','0 0 '+w+' '+h);svg.removeAttribute('width');svg.removeAttribute('height');svg.setAttribute('preserveAspectRatio','none');}
    }catch(e){const t=document.createElement('div');t.className='le lt2';t.setAttribute('style',svg.getAttribute('style')||'');t.textContent=code;svg.replaceWith(t);}
  });
}

function edUndo(){const h=ED.hist.pop();if(!h){toast('لا توجد خطوات للتراجع','bad');return;}(ED.redo=ED.redo||[]).push(JSON.stringify(LELS()));S.settings.label.els=JSON.parse(h);ED.sel=ED.sel.filter(id=>elById(id));save();paintEditor();}
function aabb(e){
  const th=(e.r||0)*Math.PI/180,c=Math.abs(Math.cos(th)),s=Math.abs(Math.sin(th));
  const hw=(e.w*c+e.h*s)/2,hh=(e.w*s+e.h*c)/2,cx=e.x+e.w/2,cy=e.y+e.h/2;
  return{l:cx-hw,r:cx+hw,t:cy-hh,b:cy+hh,cx,cy};
}

let _mctx=null;
function measureMM(text,fsPt,bold,italic){
  try{
    if(!_mctx){const c=document.createElement('canvas');_mctx=c.getContext('2d');}
    if(_mctx){_mctx.font=(italic?'italic ':'')+(bold?'700':'500')+' '+(fsPt*96/72)+"px 'IBM Plex Sans Arabic','Segoe UI',Tahoma,sans-serif";return _mctx.measureText(text).width/MMPX;}
  }catch(e){}
  return String(text).length*fsPt*0.3528*0.55;
}
function autoSizeEl(e,p,L){
  if(e.t!=='text'||e.auto===false)return false;
  let t=renderTpl(e.text,p,L);if(!t)t=String(e.text||'').replace(/[{}]/g,'')||' ';
  const lineH=e.fs*0.3528*1.12;let nw,nh;
  if(e.wr){
    nw=e.w;let lines=1,cur='';
    t.split(/\s+/).forEach(wd=>{const tr=cur?cur+' '+wd:wd;if(measureMM(tr,e.fs,e.b,e.i)<=nw-0.6)cur=tr;else{if(cur)lines++;cur=wd;}});
    nh=lineH*lines+0.4;
  }else{nw=measureMM(t,e.fs,e.b,e.i)+0.8;nh=lineH+0.4;}
  nw=Math.max(1.5,rd(nw,2));nh=Math.max(1,rd(nh,2));
  if(Math.abs(nw-e.w)<0.05&&Math.abs(nh-e.h)<0.05)return false;
  const th=(e.r||0)*Math.PI/180,ca=Math.cos(th),sa=Math.sin(th),cx=e.x+e.w/2,cy=e.y+e.h/2;
  let ncx=cx,ncy=cy;
  if(e.al==='left'){const ax=cx-(e.w/2)*ca,ay=cy-(e.w/2)*sa;ncx=ax+(nw/2)*ca;ncy=ay+(nw/2)*sa;}
  else if(e.al==='right'){const ax=cx+(e.w/2)*ca,ay=cy+(e.w/2)*sa;ncx=ax-(nw/2)*ca;ncy=ay-(nw/2)*sa;}
  e.w=nw;e.h=nh;e.x=rd(ncx-nw/2,2);e.y=rd(ncy-nh/2,2);
  return true;
}
function autoSizeAll(){const L=S.settings.label,p=sampleForLabel();let ch=false;L.els.forEach(e=>{if(autoSizeEl(e,p,L))ch=true;});return ch;}
function autoFit(){if(autoSizeAll())save();}
function toksOf(t){return [...new Set((String(t).match(/\{([A-Za-z0-9_:]+)\}/g)||[]).map(m=>m.slice(1,-1)))];}
function elsForField(k){
  const def=TPL_DEF[k]||'{'+k+'}',dt=toksOf(def);
  return S.settings.label.els.filter(e=>{if(e.t!=='text')return false;if(e.text===def)return true;const t=toksOf(e.text);return t.length===dt.length&&t.every(x=>dt.includes(x));});
}
function edAdd(kind,k){
  const L=S.settings.label;
  if(kind==='field'){const ex=elsForField(k);if(ex.length){edPush();const ids=new Set(ex.map(e=>e.id));L.els=L.els.filter(e=>!ids.has(e.id));ED.sel=ED.sel.filter(id=>!ids.has(id));save();paintEditor();toast('أُزيل «'+((fieldOptions().find(x=>x[0]===k)||[0,k])[1])+'» من الملصق');return;}}
  edPush();
  const e={id:uid(),t:kind,text:'',r:0,fs:6,b:false,al:'left',wr:false,x:0,y:0,w:10,h:3};
  if(kind==='field'){e.t='text';e.text=TPL_DEF[k]||'{'+k+'}';e.w=Math.min(20,L.w-2);e.h=3;}
  else if(kind==='text'){e.text='نص';e.w=Math.min(15,L.w-2);e.h=3;}
  else if(kind==='code'){const q=Math.max(4,Math.min(10,L.h-2));e.w=q;e.h=q;}
  else if(kind==='rect'){e.t='rect';e.w=Math.min(20,L.w-2);e.h=Math.min(8,Math.max(2,L.h-2));e.bw=0.3;}
  else{e.t='line';e.w=Math.min(15,L.w-2);e.h=0.3;}
  e.x=rd((L.w-e.w)/2,1);e.y=rd((L.h-e.h)/2,1);
  L.els.push(e);ED.sel=[e.id];save();paintEditor();
  if(e.t==='text'&&!renderTpl(e.text,sampleForLabel(),L))openInline(e.id);
}

function edDup(){

function edZ(d){
  const es=selEls();if(es.length!==1)return;edPush();
  const a=LELS(),i=a.indexOf(es[0]),j=i+d;if(j<0||j>=a.length)return;
  a.splice(i,1);a.splice(j,0,es[0]);save();paintEditor();
}
function edRot(d){const es=selEls();if(!es.length)return;edPush();es.forEach(e=>{e.r=(((e.r||0)+d)%360+360)%360;});save();paintEditor();}
function edAlign(m){
  const L=S.settings.label,es=selEls();if(!es.length)return;edPush();
  const bx=es.map(aabb);
  const ref=es.length>1?{l:Math.min(...bx.map(b=>b.l)),r:Math.max(...bx.map(b=>b.r)),t:Math.min(...bx.map(b=>b.t)),b:Math.max(...bx.map(b=>b.b))}:{l:0,r:L.w,t:0,b:L.h};
  es.forEach((e,i)=>{const b=bx[i];
    if(m==='l')e.x+=ref.l-b.l;if(m==='r')e.x+=ref.r-b.r;if(m==='c')e.x+=(ref.l+ref.r)/2-b.cx;
    if(m==='t')e.y+=ref.t-b.t;if(m==='b')e.y+=ref.b-b.b;if(m==='m')e.y+=(ref.t+ref.b)/2-b.cy;
    e.x=rd(e.x,2);e.y=rd(e.y,2);});
  save();paintEditor();
}
function edDist(m){
  const es=selEls();if(es.length<3){toast('حدّد 3 عناصر على الأقل (اضغط Shift مع النقر)','bad');return;}
  edPush();
  const hz=m==='h',k=hz?['l','r','cx']:['t','b','cy'];
  const it=es.map(e=>({e,b:aabb(e)})).sort((a,b)=>a.b[k[2]]-b.b[k[2]]);
  const first=it[0].b[k[0]],last=it[it.length-1].b[k[1]];
  const total=it.reduce((t,i)=>t+(i.b[k[1]]-i.b[k[0]]),0),gap=(last-first-total)/(it.length-1);
  let pos=first;
  it.forEach(i=>{const d=pos-i.b[k[0]];if(hz)i.e.x=rd(i.e.x+d,2);else i.e.y=rd(i.e.y+d,2);pos+=(i.b[k[1]]-i.b[k[0]])+gap;});
  save();paintEditor();
}
function edFlip(){

  if(!(t>0)){toast('لا يوجد ذيل لقلبه. حدّد طول الذيل أولًا.','bad');return;}
  edPush();
  const toLeft=L.tailSide==='right';
  L.els.forEach(e=>{e.x=rd(e.x+(toLeft?t:-t),2);});
  L.tailSide=toLeft?'left':'right';
  save();render();
}

    for(let m=0;m<=H;m++){const lg=m%10===0,md=m%5===0;rv+=`<i style="top:${rd(m*u,1)}px;width:${lg?9:md?6:3}px"></i>`;if(lg)rv+=`<b style="top:${rd(m*u+1,1)}px">${m}</b>`;}

function dragMove(ev){
  const D=ED.drag;if(!D)return;
  const sn=ED.snap,rs=v=>sn>0?Math.round(v/sn)*sn:v;
  let dx=(ev.clientX-D.x0)/D.k,dy=(ev.clientY-D.y0)/D.k;
  if(!D.moved&&Math.abs(ev.clientX-D.x0)+Math.abs(ev.clientY-D.y0)<2)return;
  D.moved=true;
  if(D.mode==='move'){
    dx=rs(dx);dy=rs(dy);
    D.snaps.forEach(sp=>{const e=elById(sp.id);if(e){e.x=rd(sp.x+dx,2);e.y=rd(sp.y+dy,2);}});
  }else if(D.mode==='resize'){
    const e=elById(D.id);if(!e)return;
    const th=D.r*Math.PI/180,c=Math.cos(th),s_=Math.sin(th);
    let w=Math.max(0.5,rs(D.w+dx*c+dy*s_)),h=Math.max(0.3,rs(D.h-dx*s_+dy*c));
    if(e.t==='code'&&S.settings.label.fmt==='qr'){w=h=Math.max(w,h);}
    const cx0=D.x+D.w/2,cy0=D.y+D.h/2;
    const px=cx0+(-D.w/2)*c-(-D.h/2)*s_,py=cy0+(-D.w/2)*s_+(-D.h/2)*c;
    const ox=(-w/2)*c-(-h/2)*s_,oy=(-w/2)*s_+(-h/2)*c;
    e.x=rd(px-ox-w/2,2);e.y=rd(py-oy-h/2,2);e.w=rd(w,2);e.h=rd(h,2);
  }else{
    const e=elById(D.id);if(!e)return;
    let a=Math.atan2(ev.clientY-D.cy,ev.clientX-D.cx)*180/Math.PI+90;
    a=ev.shiftKey?Math.round(a/15)*15:Math.round(a);
    e.r=((a%360)+360)%360;
  }
  paintCanvas();syncProps();
}

function setLb(t){

  if(['tpl','tailSide','layout','fmt','ec','codeMode'].includes(k)){
    L[k]=t.value;if(k==='tpl')L.tpl=t.value==='std'?'std':'tag';

}

async function completeSale(){
  const err=t=>{const e=$('#serr');if(e)e.textContent=t;toast(t,'bad');};
  if(!cart.length){err('أضف قطعة واحدة على الأقل.');return;}
  if(!inv.no.trim()){err('اكتب رقم الفاتورة.');return;}
  if(!inv.date){err('اختر تاريخ البيع.');return;}
  if(cart.some(l=>{const p=piece(l.pid);return !p||p.status==='sold';})){err('بعض القطع لم تعد متوفرة. أزلها من الفاتورة.');renderCart();return;}
  const bad=cart.findIndex(l=>!(l.amt>0));
  if(bad>=0){err('اكتب مبلغ البيع لكل قطعة.');const e=$('#c-amt-'+bad);if(e)e.focus();return;}
  const no=inv.no.trim();
  if(S.txs.some(x=>x.type==='sale'&&x.invNo===no)&&!await ask('رقم الفاتورة «'+no+'» مسجّل مسبقًا. هل تضيف هذه القطع كحركة جديدة بنفس الرقم؟','متابعة'))return;
  const t=cartTotals(),txid=uid(),when=dayISO(inv.date);
  const items=cart.map(l=>{const p=piece(l.pid);return{pid:p.id,name:dname(p),barcode:p.barcode,serial:p.serial,karat:p.karat,nodeId:p.nodeId,cat:pathOf(p.nodeId),aud:p.aud||'',used:p.used,weight:p.weight,size:p.size,wage:p.wage,buyPpg:p.buyPpg,cost:p.cost,amt:l.amt,vatRate:l.vatRate,vat:lineVat(l)};});
  cart.forEach(l=>{const p=piece(l.pid);p.status='sold';p.soldAt=when;p.soldTx=txid;p.invNo=no;p.soldAmt=l.amt;});
  S.txs.push({id:txid,date:when,saleDate:inv.date,type:'sale',invNo:no,items,subtotal:r2(t.sub),vat:r2(t.vat),total:r2(t.total),party:inv.party.trim(),note:inv.note.trim()});
  save();
  {const tx0=S.txs[S.txs.length-1];emitEvent('sale.created',saleOut(tx0));tx0.items.forEach(i=>{const pp=piece(i.pid);if(pp)emitEvent('piece.sold',pieceOut(pp));});}
  cart=[];inv.no='';inv.party='';inv.note='';inv.date=todayStr();
  toast('تم تسجيل البيع · '+no);render();
}

async function deleteTx(id){
  const x=S.txs.find(t=>t.id===id);if(!x||x.type==='purchase')return;

  if(x.type==='sale')x.items.forEach(i=>{const p=piece(i.pid);if(p){p.status='in';delete p.soldAt;delete p.soldTx;delete p.soldAmt;delete p.invNo;}});
  S.txs=S.txs.filter(t=>t.id!==id);save();
  if(x.type==='sale'){emitEvent('sale.deleted',saleOut(x));x.items.forEach(i=>{const pp=piece(i.pid);if(pp)emitEvent('piece.updated',pieceOut(pp));});}

function itemPass(o,it,nodeId){
  if(o.karat!=='all'&&String(it.karat)!==o.karat)return false;
  if(o.cond!=='all'&&(o.cond==='used')!==!!it.used)return false;
  if(o.aud&&o.aud!=='all'&&(it.aud||'')!==o.aud)return false;
  if(o.node!=='all'&&!(nodeId&&inSub(nodeId,o.node)))return false;
  return true;
}
function buildReport(o){

      x.items.forEach(i=>{const nid=i.nodeId||(piece(i.pid)||{}).nodeId;if(!itemPass(o,i,nid))return;

    cols=[C('التاريخ','d'),C('رقم الفاتورة','inv'),C('الرقم التسلسلي','serial'),C('الصنف','cat'),C('الفئة','aud'),C('العيار','k'),C('الحالة','cond'),C('الوزن','w','w'),C('المقاس','size'),C('إجمالي الأجرة','wage','m'),C('غرام الشراء','bp','m0'),C('التكلفة','cost','m'),C('مبلغ البيع','amt','m'),C('الضريبة','vat','m'),C('الإجمالي','tot','m'),C('الربح','prof','m')];

      const key=i.karat+'|'+(i.cat||i.name||'');const r=g[key]=g[key]||{k:i.karat,cat:i.cat||i.name||'',n:0,w:0,wage:0,cost:0,amt:0,vat:0,prof:0};

    Object.values(g).sort((a,b)=>num(b.k)-num(a.k)||a.cat.localeCompare(b.cat,'ar')).forEach(r=>rows.push(r));
    cols=[C('العيار','k'),C('الصنف','cat'),C('عدد القطع','n','n'),C('الوزن','w','w'),C('إجمالي الأجرة','wage','m'),C('التكلفة','cost','m'),C('المبيعات','amt','m'),C('الضريبة','vat','m'),C('الربح','prof','m')];

    cols=[C('الرقم التسلسلي','serial'),C('الصنف','cat'),C('الفئة','aud'),C('العيار','k'),C('الحالة','cond'),C('الوزن','w','w'),C('المقاس','size'),C('إجمالي الأجرة','wage','m'),C('غرام الشراء','bp','m0'),C('التكلفة','cost','m'),C('البيع المتوقع','exp','m'),C('الربح المتوقع','prof','m')];
  }else{
    title='تقرير القطع المُدخلة';
    S.pieces.filter(p=>inR(dstr(p.created||new Date()))&&itemPass(o,p,p.nodeId)).sort((a,b)=>String(a.created).localeCompare(String(b.created))).forEach(p=>{
      rows.push({d:dfmt(p.created),serial:p.serial||p.barcode,cat:pathOf(p.nodeId),aud:p.aud||'',k:p.karat,cond:p.used?'مستعمل':'جديد',w:p.weight,size:p.size||'',wage:r2(p.wage*p.weight),bp:p.buyPpg,cost:p.cost});});
    cols=[C('تاريخ الإدخال','d'),C('الرقم التسلسلي','serial'),C('الصنف','cat'),C('الفئة','aud'),C('العيار','k'),C('الحالة','cond'),C('الوزن','w','w'),C('المقاس','size'),C('إجمالي الأجرة','wage','m'),C('غرام الشراء','bp','m0'),C('التكلفة','cost','m')];
  }
  const tot={};cols.forEach(c=>{if(c.t&&c.t!=='m0')tot[c.f]=sum(rows,r=>+r[c.f]||0);});

}
function cellText(c,v){
  if(c.t==='w')return fmtW(v);

function reportFilterText(o){

async function exportCSV(){
  const r=buildReport(rep);
  if(!r.rows.length){toast('لا توجد بيانات للتصدير','bad');return;}
  const q=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"';
  const lines=[r.cols.map(c=>q(c.h)).join(',')].concat(r.rows.map(row=>r.cols.map(c=>c.t==='m'||c.t==='m0'||c.t==='w'||c.t==='n'?(+row[c.f]||0):q(row[c.f])).join(',')));
  if(!(window.claude&&claude.use)){
    try{
      const blob=new Blob(['\uFEFF'+lines.join('\r\n')],{type:'text/csv;charset=utf-8'});
      const url=URL.createObjectURL(blob),a=document.createElement('a');
      a.href=url;a.download='report-'+rep.type+'-'+todayStr()+'.csv';document.body.appendChild(a);a.click();a.remove();
      setTimeout(()=>URL.revokeObjectURL(url),4000);
    }catch(e){toast('تعذّر التصدير','bad');}
    return;
  }
  try{
    const dl=await claude.use('downloads');
    if(!dl){toast('التصدير غير متاح هنا','bad');return;}
    await dl.save({filename:'report-'+rep.type+'-'+todayStr()+'.csv',data:'\uFEFF'+lines.join('\r\n')});
  }catch(e){if(!e||e.code!=='declined')toast('تعذّر التصدير','bad');}
}

async function refreshPrices(force){

  pstate.st='loading';paintPrices();
  try{
    const ctl=new AbortController(),to=setTimeout(()=>ctl.abort(),8000);

}

function treeNodes(parent){

async function restoreBackup(){
  const err=t=>{$('#bkerr').textContent=t;};
  let o;try{o=JSON.parse($('#bk').value);}catch(e){err('النص ليس نسخة احتياطية صالحة.');return;}

  S=normalize(o);save();closeDlg();toast('تمت الاستعادة');render();
}

document.addEventListener('click',async e=>{
  const b=e.target.closest('[data-act]');if(!b)return;
  const a=b.dataset.act,id=b.dataset.id;
  switch(a){
    case 'nav':go(b.dataset.v);break;
    case 'extnew':{const c0=draft&&draft._extDup;if(c0){draft=null;editingExisting=false;handleCode('intake',c0,true);}break;}
    case 'verinfo':showWhatsNew(true);break;
    case 'pubhelp':openPublishHelp();break;
    case 'ltab':{ED.tab=b.dataset.v;document.querySelectorAll('#lblsec .lpane').forEach(p0=>{p0.hidden=p0.dataset.pane!==ED.tab;});document.querySelectorAll('#lblsec .ltabs button').forEach(t0=>t0.setAttribute('aria-selected',String(t0.dataset.v===ED.tab)));break;}
    case 'edredo':edRedo();break;
    case 'etgl':{const k=b.dataset.k;ED[k]=k==='ruler'?ED.ruler===false:!ED[k];b.setAttribute('aria-pressed',String(k==='ruler'?ED.ruler!==false:!!ED.grid));const c0=document.querySelector('[data-ed="'+k+'"]');if(c0)c0.checked=k==='ruler'?ED.ruler!==false:!!ED.grid;paintCanvas();break;}
    case 'lblform':printLabels([sampleForLabel()],($('#lcp')||{}).value||1);break;
    case 'prtab':prefTab='printer';render();break;
    case 'dectoggle':{const dc=draft&&draft._dec;if(dc){dc.open=!dc.open;paintDec($('#pf'),draft);}break;}
    case 'decclr':{const dc=draft&&draft._dec;if(dc){Object.keys(dc.map).forEach(i=>{if(dc.map[i]===b.dataset.f)delete dc.map[i];});if(dc.serialMode==='token'&&!Object.values(dc.map).includes('serial'))dc.serialMode='combo';dc.dirty=true;decRefresh();}break;}
    case 'deccut':decCut(+b.dataset.i);break;
    case 'deckind':{const dc=draft&&draft._dec;if(dc){dc.kind='fixed';dc.cuts=defaultCuts(dc.code);dc.seps='';dc.tokens=tokenize(dc.code,{kind:'fixed',cuts:dc.cuts});dc.map=decGuessMap(dc);dc.dirty=true;decRefresh();}break;}
    case 'decparse':decParseTyped();break;
    case 'cutadd':{const n=parseInt(($('#cutIn')||{}).value,10);if(n>0)decCut(n);break;}
    case 'decsave':{const dc=draft&&draft._dec;if(dc){decLearn(dc);save();paintDec($('#pf'),draft);}break;}
    case 'decreset':{if(draft&&draft._dec){const code=draft._dec.code;draft._dec=decAuto(code);draft._dec.open=true;decRefresh();}break;}
    case 'hookadd':openHookDlg();break;
    case 'hookedit':openHookDlg(id);break;
    case 'hookdel':if(await ask('حذف هذا الربط؟','حذف')){S.settings.integ.hooks=S.settings.integ.hooks.filter(h=>h.id!==id);OB=obLoad().filter(i=>i.hook!==id);obSave();save();render();}break;
    case 'hooktest':hookTest(id);break;
    case 'obflush':obLoad().forEach(i=>{i.next=0;});flushOutbox();toast('جارٍ إعادة الإرسال');break;
    case 'obclear':if(await ask('مسح كل الرسائل المنتظرة؟ لن تُرسل.','مسح')){OB=[];obSave();paintHookLog();}break;
    case 'ixrange':{const n=new Date(),o={p:b.dataset.v,y:n.getFullYear(),m:n.getMonth(),d:todayStr()},r=rangeOf(o);if(r){ix.from=r[0];ix.to=r[1];render();}break;}
    case 'ixexp':({journal:exportJournal,invoices:exportInvoices,expenses:exportExpenses,stock:exportStockAll,json:exportJSONAll}[b.dataset.k]||(()=>{}))();break;
    case 'feedexp':exportFeed();break;
    case 'prmode':{S.settings.printer.mode=b.dataset.v;S.settings.printer=normPrinter(S.settings.printer);save();render();break;}
    case 'prconnect':{const m=$('#prmsg');try{await prnConnect();toast('تم الاتصال بالطابعة');render();}catch(er){if(m)m.textContent=(er&&er.name==='NotFoundError')?'لم تختر أي جهاز.':((er&&er.message)||String(er));}break;}
    case 'przebra':{
      const PS=S.settings.printer;Object.assign(PS,{mode:'usb',lang:'epl',dpi:203,media:'gap',gap:3,density:8,speed:4,invert:false});S.settings.printer=normPrinter(PS);save();
      const m=$('#prmsg');
      try{await prnConnect();toast('تم ربط الطابعة وضبطها');}catch(er){render();const m2=$('#prmsg');if(m2)m2.textContent=(er&&er.name==='NotFoundError')?'لم تختر أي جهاز. أُعدّ الإعداد فقط، اضغط «اختيار الطابعة / اتصال» عند جاهزيتك.':((er&&er.message)||String(er));break;}
      render();break;}
    case 'prdisc':await prnDisconnect();render();break;
    case 'prtest':{const m=$('#prmsg');if(m)m.textContent='';printLabels([sampleForLabel()],1);break;}
    case 'prping':{const m=$('#prmsg'),PS=S.settings.printer;try{const r=await fetch(PS.bridgeUrl.replace(/\/$/,'')+'/ping');const j=await r.json();if(m){m.className='hint';m.textContent='الوسيط يعمل (إصدار '+j.bridge+' على '+j.os+').';}}catch(er){if(m){m.className='err';m.textContent='لا يمكن الوصول للوسيط على '+PS.bridgeUrl+'. شغّله ثم أعد الفحص.';}}break;}
    case 'prbridge':saveTextFile('jard-print-bridge.py',BRIDGE_PY,'text/x-python;charset=utf-8');break;
    case 'pill':{if(cloud.status==='conflict'&&cloud.pendingRow)openConflict(cloud.pendingRow);else if(!cloud.on)showAuth();else{prefTab='general';go('prefs');}break;}

    case 'perset':lp.p=b.dataset.v;render();break;
    case 'cstart':{const pcs=countScope(cscope);if(!pcs.length){toast('لا توجد قطع ضمن هذا النطاق','bad');break;}S.counts=S.counts||[];S.counts.push({id:uid(),name:cscope.name.trim()||('جرد '+dfmt(new Date())),date:new Date().toISOString(),status:'open',scope:{karat:cscope.karat,aud:cscope.aud,node:cscope.node,cond:cscope.cond},expected:pcs.map(p=>p.id),scans:[]});cfb=null;ctab='scanned';save();render();break;}

    case 'ccam':openScanner(code=>{countScan(code);});break;

    case 'reprange':{const n=new Date(),y=+(($('#repy')||{}).value)||n.getFullYear(),o={p:b.dataset.v,y,m:n.getMonth(),d:todayStr()},r=rangeOf(o);if(r){rep.from=r[0];rep.to=r[1];rep.pn=periodName(o);const f=$('[data-rep="from"]'),t=$('[data-rep="to"]');if(f)f.value=r[0];if(t)t.value=r[1];paintReport();}break;}

    case 'tplapply':{const v=($('#tplSel')||{}).value||'';if(v.startsWith('d:'))edLoad(v.slice(2));else if(v==='tag'||v==='std'){S.settings.label.tpl=v;S.settings.labelActive='';edTpl();}break;}
    case 'edundo':edUndo();break;
    case 'ezoom':{const d=b.dataset.d,cur=edZoom();ED.z=d==='0'?0:Math.max(0.5,Math.min(8,cur*(d==='+'?1.25:0.8)));paintCanvas();break;}
    case 'kvadd':openKvAdd();break;
    case 'kvdel':{const kf=S.settings.bfmt.kv.fields[+b.dataset.i];if(kf){const L=S.settings.label;L.codeTpl=L.codeTpl.replace(new RegExp(kf.key+'\\{\\}','g'),'');}S.settings.bfmt.kv.fields.splice(+b.dataset.i,1);save();render();break;}
    case 'codetoggle':toggleCodeField(b.dataset.f);break;
    case 'codedel':toggleCodeKey(b.dataset.k,false);break;
    case 'codekey':toggleCodeKey(b.dataset.k,!(S.settings.label.codeMode==='tpl'&&tplKeys().includes(b.dataset.k)));break;
    case 'fmove':{const i=+b.dataset.i,j=i+(+b.dataset.d),f=S.settings.bfmt.fields;if(j>=0&&j<f.length){const t=f[i];f[i]=f[j];f[j]=t;save();render();}break;}
    case 'addchild':{
      const p=node(id);if(!p)break;
      if(S.pieces.some(x=>x.nodeId===id)){toast('انقل قطع هذا الصنف إلى فرع أولًا','bad');break;}
      const nid=uid();S.settings.nodes.push({id:nid,name:'صنف جديد',parent:id,bullion:false});save();render();

      break;

    case 'delnode':{

      if(kids(id).length){toast('احذف الفروع أولًا','bad');break;}
      const used=S.pieces.filter(p=>p.nodeId===id).length;
      if(used){toast('يوجد '+used+' قطعة بهذا الصنف. انقلها إلى صنف آخر أولًا','bad');break;}

    case 'delfield':{const f=S.settings.customFields.find(c=>c.key===b.dataset.k);if(f&&await ask('حذف الحقل «'+f.label+'» من كل القطع؟','حذف')){S.settings.customFields=S.settings.customFields.filter(c=>c.key!==f.key);S.settings.bfmt.kv.fields=S.settings.bfmt.kv.fields.filter(x=>x.field!=='x:'+f.key);S.pieces.forEach(p=>{if(p.extra)delete p.extra[f.key];});save();render();}break;}
    case 'reset':if(await ask('سيتم مسح كل القطع والحركات والجرود نهائيًا'+(cloud.on?' من هذا الجهاز ومن حسابك السحابي أيضًا':'')+'. أنشئ نسخة احتياطية أولًا إن كنت تحتاجها. هل تتابع؟','مسح كل البيانات')){S.pieces=[];S.txs=[];S.counts=[];cart=[];draft=null;save();toast('تم المسح');render();}break;
    case 'backup':openBackup();break;
    case 'bkcopy':{const t=$('#bk');t.select();let ok=false;try{ok=document.execCommand('copy');}catch(er){}if(!ok&&navigator.clipboard)try{await navigator.clipboard.writeText(t.value);ok=true;}catch(er){}toast(ok?'تم النسخ':'حدّد النص وانسخه يدويًا',ok?'':'bad');break;}
    case 'bkrestore':restoreBackup();break;

const main=$('#main');
main.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset.lb!==undefined){setLb(t);return;}
  if(t.dataset.ep!==undefined){setEp(t);return;}
  if(t.dataset.ed==='snap'){ED.snap=parseFloat(t.value)||0;return;}
  if(t.dataset.sp!==undefined){setSp(t);return;}
  if(t.id==='einTxt'){applyInline(t.value);return;}
  if(t.dataset.cart){
    const i=+t.dataset.i,l=cart[i];if(!l)return;
    if(t.dataset.cart==='amt')l.amt=Math.max(0,num(t.value));else l.vatRate=Math.max(0,num(t.value));
    updateCartDom(i);
  }else if(t.dataset.inv){inv[t.dataset.inv]=t.value;}
  else if(t.id==='bfTest')bfOut();
});
main.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.spload!==undefined){
    const p=piece(t.value);if(p){ED.sample=Object.assign({},p,{extra:Object.assign({},p.extra||{})});paintCanvas();paintSample();}
  }
  else if(t.id==='codeAdd'){if(t.value)toggleCodeField(t.value);}
  else if(t.id==='einTok'){insertToken($('#einTxt'),t.value,applyInline);t.value='';}
  else if(t.id==='epTok'){const ip=$('#eprops [data-ep="text"]');insertToken(ip,t.value,v=>{ip.dispatchEvent(new Event('input',{bubbles:true}));});t.value='';}
  else if(t.id==='einMode'){S.settings.label.codeMode=t.value==='tpl'?'tpl':'barcode';save();paintInline();paintCanvas();const i=$('#einTxt');if(i&&!i.disabled)i.focus();}
  else if(t.id==='per'){period=t.value;render();}
  else if(t.dataset.pr!==undefined){setPr(t);}
  else if(t.dataset.inc!==undefined){const bf=S.settings.bfmt;bf.genOff=bf.genOff||[];const n=t.dataset.inc,i=bf.genOff.indexOf(n);if(t.checked&&i>=0)bf.genOff.splice(i,1);else if(!t.checked&&i<0)bf.genOff.push(n);save();const f0=$('#pf');if(f0)f0.dispatchEvent(new Event('recalc'));}
  else if(t.dataset.ed==='ruler'||t.dataset.ed==='grid'){ED[t.dataset.ed]=t.checked;const bt=document.querySelector('[data-act="etgl"][data-k="'+t.dataset.ed+'"]');if(bt)bt.setAttribute('aria-pressed',String(t.checked));paintCanvas();}

  else if(t.dataset.dser!==undefined){decSetSerial(t.value);}
  else if(t.dataset.dbm!==undefined){decSetBarcode(t.value);}
  else if(t.dataset.ia!==undefined){S.settings.integ.acct[t.dataset.ia]=t.value.trim().slice(0,60);save();}

  else if(t.dataset.hk!==undefined){const h=S.settings.integ.hooks.find(x=>x.id===t.dataset.hk);if(h){h.on=t.checked;save();}}
  else if(t.dataset.ix!==undefined){ix[t.dataset.ix]=t.value;}

  else if(t.dataset.cs!==undefined){cscope[t.dataset.cs]=t.value;if(t.dataset.cs!=='name')vCount($('#main'));}
  else if(t.id==='pday'){lp.d=t.value||todayStr();render();}
  else if(t.id==='pmon'){lp.m=+t.value;render();}
  else if(t.id==='pyear'){lp.y=+t.value;render();}
  else if(t.id==='invq'){txQ=t.value;vLedger($('#main'));}
  else if(t.id==='nodeSel'){stF.node=t.value;renderList();}
  else if(t.dataset.nname!==undefined)renameNode(t.dataset.nname,t.value);
  else if(t.dataset.vfree!==undefined){const a=S.settings.vatFree=(S.settings.vatFree||[]).filter(k=>k!==t.dataset.vfree);if(t.checked)a.push(t.dataset.vfree);save();toast('تم الحفظ');}
  else if(t.id==='bfMode'){S.settings.bfmt.mode=['sep','kv'].includes(t.value)?t.value:'pos';save();render();}
  else if(t.dataset.kvcode!==undefined){const f=S.settings.bfmt.kv.fields[+t.dataset.kvcode];if(f)toggleCodeKey(f.key,t.checked);}
  else if(t.dataset.kvk!==undefined){const f=S.settings.bfmt.kv.fields[+t.dataset.kvk],oldK=f.key;f.key=t.value.replace(/[^a-zA-Z]/g,'');t.value=f.key;if(oldK!==f.key){const L=S.settings.label;L.codeTpl=L.codeTpl.replace(new RegExp(oldK+'\\{\\}','g'),f.key?f.key+'{}':'');}save();toast('تم الحفظ');bfOut();refreshLinks();}
  else if(t.dataset.kvf!==undefined){const f=S.settings.bfmt.kv.fields[+t.dataset.kvf];f.field=t.value;f.type=(KVSTR[t.value]||String(t.value).startsWith('x:'))?'string':'number';save();toast('تم الحفظ');render();}
  else if(t.dataset.kvt!==undefined){S.settings.bfmt.kv.fields[+t.dataset.kvt].type=t.value==='string'?'string':'number';save();toast('تم الحفظ');bfOut();}
  else if(t.dataset.kvon!==undefined){S.settings.bfmt.kv.fields[+t.dataset.kvon].on=t.checked;save();toast('تم الحفظ');bfOut();}
  else if(t.dataset.kvkarat!==undefined){S.settings.bfmt.kv.karatFromCode=t.checked;save();toast('تم الحفظ');render();}
  else if(t.dataset.lbp!==undefined){const v=t.value;if(v){const [w,h,tl]=v.split('x').map(Number);const L=S.settings.label;L.w=w;L.h=h;if(L.tpl==='tag')L.tail=tl||0;save();render();}}
  else if(t.dataset.pos!==undefined){S.settings.bfmt.pos[t.dataset.pos]=Math.min(8,Math.max(1,parseInt(latin(t.value),10)||1));save();toast('تم الحفظ');render();}
  else if(t.dataset.fon!==undefined){S.settings.bfmt.fields[+t.dataset.fon].on=t.checked;save();toast('تم الحفظ');bfOut();}
  else if(t.dataset.fdiv!==undefined){S.settings.bfmt.fields[+t.dataset.fdiv].div=num(t.value)||1;save();toast('تم الحفظ');bfOut();}
});

function normPhone(v){

const emailOk=v=>/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v);
const redirectTo=()=>{try{return inPreview()?'':(location.origin+location.pathname);}catch(e){return '';}};
const qRt=()=>{const r=redirectTo();return r?'?redirect_to='+encodeURIComponent(r):'';};
async function authEmailSubmit(){

  if(!emailOk(email)){auth.err='أدخل بريدًا إلكترونيًا صحيحًا.';return paintAuth();}
  if(!pw){auth.err='أدخل كلمة المرور.';return paintAuth();}
  auth.busy=true;auth.err='';paintAuth();
  try{
    if(auth.mode==='signup'){
      if(pw.length<8){auth.err='كلمة المرور 8 أحرف على الأقل.';auth.busy=false;return paintAuth();}
      if(pw!==pw2){auth.err='كلمتا المرور غير متطابقتين.';auth.busy=false;return paintAuth();}
      const d=await cfetch('/auth/v1/signup'+qRt(),{method:'POST',auth:false,body:{email,password:pw,data:{pw:true}}});
      if(d&&d.access_token){setSession(d);await authFinish();return;}
      if(d&&Array.isArray(d.identities)&&d.identities.length===0){auth.err='هذا البريد مسجّل مسبقًا. ادخل بكلمة المرور، أو استعدها من «نسيت كلمة المرور».';auth.mode='login';}
      else{auth.step='emailsent';auth.purpose='signup';auth.info='';startCool();}
    }else{
      const d=await cfetch('/auth/v1/token?grant_type=password',{method:'POST',auth:false,body:{email,password:pw}});
      setSession(d);await authFinish();return;
    }
  }catch(e){
    if(e&&/email_not_confirmed/i.test(String(e.code||'')+' '+String(e.message||''))){auth.step='emailsent';auth.purpose='signup';auth.err='لم يتم تأكيد البريد بعد. افتح رسالة التأكيد أو اطلب إعادة إرسالها.';}

  auth.busy=false;paintAuth();
}

  auth.busy=true;auth.err='';paintAuth();

  if(q.get('error')||q.get('error_code')){
    load();showAuth('email');
    auth.err=/expired|otp_expired/i.test((q.get('error_code')||'')+(q.get('error_description')||''))?'انتهت صلاحية الرابط أو استُخدم من قبل. ادخل بكلمة المرور أو اطلب رابطًا جديدًا.':'تعذّر إكمال العملية: '+String(q.get('error_description')||q.get('error')||'').replace(/\+/g,' ');
    paintAuth();return true;
  }
  const at=q.get('access_token');if(!at)return false;
  try{
    const u=await cfetch('/auth/v1/user',{auth:false,headers:{Authorization:'Bearer '+at}});
    setSession({access_token:at,refresh_token:q.get('refresh_token'),expires_in:+q.get('expires_in')||3600,user:u});
    if(q.get('type')==='recovery'){load();auth.intent='reset';showAuth('setpw');return true;}
    await cloudStart();hideAuth();render();toast('تم تأكيد البريد وتسجيل الدخول');return true;
  }catch(e){load();showAuth('email');auth.err=authErr(e);paintAuth();return true;}
}
(function bindAuth(){
  const el=$('#authScr');if(!el)return;
  el.addEventListener('submit',e=>{e.preventDefault();if(auth.busy)return;({email:authEmailSubmit,emailsent:authEmailVerify,phone:authSend,pwlogin:authPwLogin,otp:authVerify,setpw:authSetPw}[auth.step]||(()=>{}))();});
  el.addEventListener('click',e=>{
    const b=e.target.closest('[data-au]');if(!b)return;
    const keep=()=>{const p=authVal('phone');if(p)auth.phone=p;};
    switch(b.dataset.au){
      case 'tab-email':{const p0=authVal('phone');if(p0)auth.phone=p0;auth.step='email';auth.err='';paintAuth();break;}
      case 'tab-phone':{const e0=authVal('email');if(e0)auth.email=e0;auth.step='phone';auth.err='';paintAuth();break;}
      case 'mode-login':case 'mode-signup':{const e0=authVal('email');if(e0)auth.email=e0;auth.mode=b.dataset.au==='mode-signup'?'signup':'login';auth.err='';paintAuth();break;}
      case 'forgot-email':authForgot();break;
      case 'resend-email':if(auth.cool<=0)authEmailResend();break;
      case 'change-email':auth.step='email';auth.err='';auth.info='';paintAuth();break;
      case 'tab-otp':keep();auth.step='phone';auth.err='';paintAuth();break;
      case 'tab-pw':keep();auth.step='pwlogin';auth.err='';paintAuth();break;
      case 'forgot':keep();auth.intent='reset';auth.step='phone';auth.err='';auth.info='سيصلك رمز تحقق ثم تعيّن كلمة مرور جديدة.';paintAuth();break;
      case 'resend':if(auth.cool<=0){auth.step='phone';authSend();}break;
      case 'change':auth.step='phone';auth.err='';auth.intent='login';paintAuth();break;
      case 'guest':lsSet(CK.guest,1);hideAuth();render();paintPill();break;
      case 'help':openPublishHelp();break;
    }
  });
})();

/* ================= init ================= */
fromHash();render();
paintVersion();
cloudBoot().then(()=>{fromHash();render();paintPill();paintVersion();prnAutoReconnect();maybeShowWhatsNew();});
refreshPrices();
setInterval(()=>{if(S.settings.priceSrc==='auto')refreshPrices(true);},300000);
})();
</script>
